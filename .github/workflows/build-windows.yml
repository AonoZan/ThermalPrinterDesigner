name: Build ThermalLabelStudio (Windows)

# Trigger the workflow on pushes/PRs to main, or manually via GitHub UI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Change this to your preferred Python version
          cache: 'pip'           # Caches packages to speed up future builds

      # 3. Install Python Packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pillow python-escpos numpy pyusb libusb-package pyinstaller

      # 4. Run PyInstaller (Using your exact PowerShell logic)
      - name: Compile with PyInstaller
        run: |
          if (Test-Path -Path "build.spec") {
              Write-Host "Spec file found. Building from build.spec..."
              pyinstaller --noconfirm build.spec
          } else {
              Write-Host "Warning: Spec file not found. Using manual flags."
              pyinstaller --noconfirm --onefile --windowed `
                  --collect-all customtkinter `
                  --collect-all libusb_package `
                  label_designer.py
          }

      # 5. Upload the generated executable so you can download it
      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermalLabelStudio-Windows-EXE
          path: dist/
          if-no-files-found: error